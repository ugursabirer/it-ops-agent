<svg xmlns="http://www.w3.org/2000/svg" width="786" height="1153" viewBox="0 0 786 1153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="786" height="1153" rx="10" fill="#11131a"/>
<path d="M0 10 a10 10 0 0 1 10 -10 h766 a10 10 0 0 1 10 10 v24 h-786 z" fill="#1b1e27"/>
<circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
<circle cx="39" cy="17" r="5.5" fill="#febc2e"/>
<circle cx="58" cy="17" r="5.5" fill="#28c840"/>
<text x="78" y="22" fill="#8a93a6">Senaryo 5</text>
<text x="18" y="65" fill="#f0a73a" xml:space="preserve">SENARYO 5/6</text>
<text x="18" y="84" fill="#ffffff" xml:space="preserve">Kullanici: Elif Demir de yeni bir dizustu istiyor, onun hakki var mi?</text>
<text x="18" y="122" fill="#f0a73a" xml:space="preserve">[SUPERVISOR] kulvar: talep</text>
<text x="18" y="141" fill="#58b6ff" xml:space="preserve">[AGENT] Planner Agent</text>
<text x="18" y="160" fill="#c08bff" xml:space="preserve">[PLAN]</text>
<text x="18" y="179" fill="#d6dae3" xml:space="preserve">  1. Dizüstü bilgisayar yenileme süresini ve istisna kurallarını Politika&#x27;dan oku</text>
<text x="18" y="198" fill="#d6dae3" xml:space="preserve">  2. Elif Demir&#x27;in çalışan kaydını ve zimmetli cihaz durumunu Operasyonel Veri&#x27;den bul</text>
<text x="18" y="217" fill="#d6dae3" xml:space="preserve">  3. Cihazın yaşını ve son 6 aydaki arıza geçmişi ile mevcut açık talepleri kontrol et</text>
<text x="18" y="236" fill="#d6dae3" xml:space="preserve">  4. Politika kurallarıyla cihaz durumunu karşılaştırarak yenileme hakkı olup olmadığını belirle</text>
<text x="18" y="255" fill="#d6dae3" xml:space="preserve">  5. Hakkı varsa yedek cihaz stokunu kontrol edip BT talebi aç</text>
<text x="18" y="274" fill="#58b6ff" xml:space="preserve">[AGENT] Policy Agent (RAG)</text>
<text x="18" y="293" fill="#d6dae3" xml:space="preserve">         -&gt; tool cagrisi: search_it_policy</text>
<text x="18" y="312" fill="#4fd18b" xml:space="preserve">  [TOOL] search_it_policy(&#x27;cihaz yenileme süresi ve istisnalar&#x27;)</text>
<text x="18" y="331" fill="#58b6ff" xml:space="preserve">[AGENT] Policy Agent (RAG)</text>
<text x="18" y="350" fill="#d6dae3" xml:space="preserve">         -&gt; Elif Demir&#x27;in dizüstü bilgisayar yenileme hakkı, aşağıdaki kurallara göre değerlendirilir:</text>
<text x="18" y="369" fill="#d6dae3" xml:space="preserve">  * **Normal Yenileme Süresi:** Dizüstü bilgisayarlar **36 ay (3 yıl)** kullanım sonunda yenilenir. Bu</text>
<text x="18" y="388" fill="#d6dae3" xml:space="preserve">  süre cihazın satın alma tari...</text>
<text x="18" y="407" fill="#58b6ff" xml:space="preserve">[AGENT] Operations Agent (MCP)</text>
<text x="18" y="426" fill="#d6dae3" xml:space="preserve">         -&gt; tool cagrisi: find_employee</text>
<text x="18" y="445" fill="#4fd18b" xml:space="preserve">  [MCP] find_employee(query=&#x27;Elif Demir&#x27;)</text>
<text x="18" y="464" fill="#4fd18b" xml:space="preserve">[MCP TOOL] find_employee(Elif Demir)</text>
<text x="18" y="483" fill="#58b6ff" xml:space="preserve">[AGENT] Operations Agent (MCP)</text>
<text x="18" y="502" fill="#d6dae3" xml:space="preserve">         -&gt; tool cagrisi: get_employee_assets</text>
<text x="18" y="521" fill="#4fd18b" xml:space="preserve">  [MCP] get_employee_assets(employee_id=&#x27;E-1002&#x27;)</text>
<text x="18" y="540" fill="#4fd18b" xml:space="preserve">[MCP TOOL] get_employee_assets(E-1002)</text>
<text x="18" y="559" fill="#58b6ff" xml:space="preserve">[AGENT] Operations Agent (MCP)</text>
<text x="18" y="578" fill="#d6dae3" xml:space="preserve">         -&gt; tool cagrisi: get_asset_failure_history</text>
<text x="18" y="597" fill="#4fd18b" xml:space="preserve">  [MCP] get_asset_failure_history(asset_id=&#x27;AST-5003&#x27;, months=6)</text>
<text x="18" y="616" fill="#4fd18b" xml:space="preserve">[MCP TOOL] get_asset_failure_history(AST-5003, months=6)</text>
<text x="18" y="635" fill="#58b6ff" xml:space="preserve">[AGENT] Operations Agent (MCP)</text>
<text x="18" y="654" fill="#d6dae3" xml:space="preserve">         -&gt; tool cagrisi: get_asset_failure_history</text>
<text x="18" y="673" fill="#4fd18b" xml:space="preserve">  [MCP] get_asset_failure_history(asset_id=&#x27;AST-5003&#x27;, months=6)</text>
<text x="18" y="692" fill="#4fd18b" xml:space="preserve">[MCP TOOL] get_asset_failure_history(AST-5003, months=6)</text>
<text x="18" y="711" fill="#58b6ff" xml:space="preserve">[AGENT] Operations Agent (MCP)</text>
<text x="18" y="730" fill="#d6dae3" xml:space="preserve">         -&gt; Elif Demir (E-1002) için gereken operasyonel veriler toplanmıştır: * **Çalışan Kaydı:**</text>
<text x="18" y="749" fill="#d6dae3" xml:space="preserve">  Elif Demir, Finans departmanında Finans Uzmanı olarak görev yapmaktadır. * **Zimmetli Cihaz:** 1 adet</text>
<text x="18" y="768" fill="#d6dae3" xml:space="preserve">  dizüstü bilgisayar (AST-5003, ...</text>
<text x="18" y="787" fill="#58b6ff" xml:space="preserve">[AGENT] Decision Agent</text>
<text x="18" y="806" fill="#d6dae3" xml:space="preserve">         -&gt; KARAR: UYGUN DEĞİL **Sebep:** Politika gereği dizüstü bilgisayarlar **36 ay** kullanımda</text>
<text x="18" y="825" fill="#d6dae3" xml:space="preserve">  yenilenir ancak Elif Demir&#x27;in cihazı (AST-5003) sadece **19 aydır**. Ayrıca, 36 ay dolmadan yenileme</text>
<text x="18" y="844" fill="#d6dae3" xml:space="preserve">  için &quot;son 6 ayda en az 2 arıza...</text>
<text x="18" y="863" fill="#58b6ff" xml:space="preserve">[AGENT] Reporter Agent</text>
<text x="18" y="901" fill="#9ae6b4" xml:space="preserve">Asistan: Karar: uygun değil</text>
<text x="18" y="939" fill="#d6dae3" xml:space="preserve">Gerekçe:</text>
<text x="18" y="958" fill="#d6dae3" xml:space="preserve">- Kural: Dizüstü bilgisayarlar **36 ay** kullanım sonunda yenilenir; istisnalar (son 6 ayda ≥2 arıza,</text>
<text x="18" y="977" fill="#d6dae3" xml:space="preserve">  onarılamaz rapor vb.) aranır.</text>
<text x="18" y="996" fill="#d6dae3" xml:space="preserve">- Gerçek: Cihazın yaşı **19 ay**, son 6 ayda **0** arıza kaydı var ve rol değişikliği yok.</text>
<text x="18" y="1034" fill="#d6dae3" xml:space="preserve">Yapılan islem:</text>
<text x="18" y="1053" fill="#d6dae3" xml:space="preserve">- Talep açılmadı (politikaya uygun bulunmadığı için).</text>
<text x="18" y="1091" fill="#d6dae3" xml:space="preserve">Sonraki adım:</text>
<text x="18" y="1110" fill="#d6dae3" xml:space="preserve">- Elif Demir&#x27;e cihazın normal yenileme süresinin (36 ay) dolmasını beklemesi veya tekrarlayan arıza</text>
<text x="18" y="1129" fill="#d6dae3" xml:space="preserve">  geçmişi oluşturması gerektiği bildirilmelidir.</text>
</svg>