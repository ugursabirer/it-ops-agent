<circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
<circle cx="39" cy="17" r="5.5" fill="#febc2e"/>
<circle cx="58" cy="17" r="5.5" fill="#28c840"/>
<text x="78" y="22" fill="#8a93a6">Senaryo 1</text>
<text x="18" y="65" fill="#f0a73a" xml:space="preserve">SENARYO 1/6</text>
<text x="18" y="84" fill="#ffffff" xml:space="preserve">Kullanici: Merhaba, sen neler yapabiliyorsun?</text>
<text x="18" y="122" fill="#f0a73a" xml:space="preserve">[SUPERVISOR] kulvar: selamlama</text>
<text x="18" y="141" fill="#58b6ff" xml:space="preserve">[AGENT] Greeting Agent</text>
<text x="18" y="179" fill="#9ae6b4" xml:space="preserve">Asistan: Merhaba! Ben kurumsal BT destek asistanınızım. Size şu konularda yardımcı olabilirim:</text>
<text x="18" y="217" fill="#d6dae3" xml:space="preserve">*   **Politika Bilgisi:** Donanım yenileme, talep/SLA, lisans yönetimi, bilgi güvenliği ve VPN erişim</text>
<text x="18" y="236" fill="#d6dae3" xml:space="preserve">  politikalarınızı kaynak göstererek açıklayabilirim.</text>
<text x="18" y="255" fill="#d6dae3" xml:space="preserve">*   **Durum Sorgulama:** Cihaz zimmet durumu, açık talepleriniz, yetkileriniz ve yedek cihaz stok</text>
<text x="18" y="274" fill="#d6dae3" xml:space="preserve">  bilgilerini sorgulayabilirim.</text>
<text x="18" y="293" fill="#d6dae3" xml:space="preserve">*   **Talep Yönetimi:** Talebinizin politikaya uygunluğunu değerlendirip, onay sürecini takip ederek BT</text>
<text x="18" y="312" fill="#d6dae3" xml:space="preserve">  talebini açabilirim.</text>
<text x="18" y="350" fill="#d6dae3" xml:space="preserve">Sizden hangi konuda bilgiye ihtiyacınız var?</text>
</svg>